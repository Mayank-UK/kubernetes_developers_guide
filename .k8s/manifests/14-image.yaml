# Deployment image — topic image proxy (GET /image?topic=).
# Teaches: Phase 2/3 — third workload, same pattern; note the different health path (/healthz) — probes are
#   per-app, not boilerplate to copy blindly.
# Commands:
#   kubectl apply -f .k8s/manifests/14-image.yaml
#   kubectl describe deployment image -n k8slab
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image
  namespace: k8slab
  labels:
    app.kubernetes.io/name: image
    app.kubernetes.io/part-of: k8slab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: image
  template:
    metadata:
      labels:
        app.kubernetes.io/name: image
        app.kubernetes.io/part-of: k8slab
    spec:
      containers:
      - name: image
        image: k8slab/image:v1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
