# Secret k8slab-secret — deliberately NOT consumed by any pod (there is no real API key in this lab).
# Teaches: Phase 3 — Secrets vs ConfigMaps, and reading one back out. The value decodes to super-secret-demo.
#   Note: base64 is ENCODING, not encryption — anyone with read access to the Secret sees the plaintext.
# Commands:
#   kubectl get secret k8slab-secret -n k8slab -o jsonpath='{.data.WIKI_API_KEY}' | base64 -d; echo
#   kubectl describe secret k8slab-secret -n k8slab   # values are withheld, sizes only
apiVersion: v1
kind: Secret
metadata:
  name: k8slab-secret
  namespace: k8slab
  labels:
    app.kubernetes.io/name: k8slab-secret
    app.kubernetes.io/part-of: k8slab
type: Opaque
data:
  WIKI_API_KEY: c3VwZXItc2VjcmV0LWRlbW8=
