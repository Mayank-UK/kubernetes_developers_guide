# kind cluster config for the k8slab lab — NOT a Kubernetes resource: never `kubectl apply` this file.
# Teaches: Phase 0 — a kind cluster where every node is a plain Docker container.
#   The control-plane patch (node-labels ingress-ready=true) + extraPortMappings 80->8090 is the documented
#   kind ingress recipe: it lets ingress-nginx bind the host port so the lab answers at http://localhost:8090
#   (8090 because the github_actions lab's cluster holds the old host port when both run together).
# Commands:
#   kind create cluster --config .k8s/kind-cluster.yaml --name k8slab
#   kubectl get nodes -o wide
#   docker ps --filter label=io.x-k8s.kind.cluster=k8slab   # see nodes as containers
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  - containerPort: 80
    hostPort: 8090
    protocol: TCP
- role: worker
- role: worker
