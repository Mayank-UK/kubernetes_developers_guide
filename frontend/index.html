<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>k8slab — the guide</title>
<!-- Self-hosted Umami analytics: the wrapper (first) + the beacon tag
     whose src/data-website-id are placeholder tokens swapped when the
     frontend image is built with the UMAMI_* build args (see
     .docker/frontend/Dockerfile). Builds without them ship this page with
     NO beacon tag at all — the wrapper then no-ops. -->
<script defer src="/js/analytics.js"></script>
<script defer src="__UMAMI_SRC__" data-website-id="__UMAMI_ID__"></script>
<!-- highlight.js theme is deliberately dark on BOTH modes (GitHub-style:
     dark code blocks read fine on light pages) and is only loaded from the
     image's /vendor dir — never a CDN. -->
<link rel="stylesheet" href="/vendor/highlight-github-dark.min.css">
<style>
  :root {
    --bg: #f1f5f9; --fg: #0f172a; --muted: #475569; --border: #cbd5e1;
    --border-soft: #e2e8f0; --code-bg: #e2e8f0; --accent: #1d4ed8;
    --hover: #e2e8f0; --toc-w: 270px;
  }
  html[data-theme="dark"] {
    --bg: #0f172a; --fg: #e2e8f0; --muted: #94a3b8; --border: #334155;
    --border-soft: #1e293b; --code-bg: #1e293b; --accent: #60a5fa;
    --hover: #1e293b;
  }
  @media (prefers-color-scheme: dark) {
    html:not([data-theme]) {
      --bg: #0f172a; --fg: #e2e8f0; --muted: #94a3b8; --border: #334155;
      --border-soft: #1e293b; --code-bg: #1e293b; --accent: #60a5fa;
      --hover: #1e293b;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.65 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .topbar {
    position: sticky; top: 0; z-index: 10; display: flex; align-items: center;
    gap: 12px; padding: 10px 20px; background: var(--bg);
    border-bottom: 1px solid var(--border-soft);
  }
  .topbar .brand { font-weight: 700; }
  .topbar .brand code {
    background: var(--code-bg); border-radius: 6px; padding: 1px 7px;
    font-size: .92em;
  }
  .topbar .spacer { flex: 1; }
  .topbar button, .topbar a.app-link {
    font: inherit; font-size: .85rem; padding: 4px 12px; cursor: pointer;
    color: var(--fg); background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; text-decoration: none; display: inline-block;
  }
  .topbar a.app-link:hover, .topbar button:hover { background: var(--hover); }
  .layout { display: flex; max-width: 1180px; margin: 0 auto; }
  nav.toc {
    position: sticky; top: 45px; align-self: flex-start;
    width: var(--toc-w); max-height: calc(100vh - 45px); overflow-y: auto;
    padding: 24px 12px 48px 20px; font-size: .85rem; line-height: 1.45;
    border-right: 1px solid var(--border-soft);
  }
  nav.toc .toc-title {
    font-size: .75rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted); margin-bottom: 8px;
  }
  nav.toc ol { list-style: none; margin: 0; padding: 0; }
  nav.toc li { margin: 2px 0; }
  nav.toc a {
    display: block; padding: 3px 8px; border-radius: 6px;
    color: var(--muted); text-decoration: none; border-left: 2px solid transparent;
  }
  nav.toc a:hover { color: var(--fg); background: var(--hover); }
  nav.toc a.active {
    color: var(--accent); font-weight: 600;
    border-left-color: var(--accent); background: var(--hover);
  }
  nav.toc a.lvl1 { font-weight: 600; color: var(--fg); }
  nav.toc a.lvl3 { padding-left: 22px; }
  main.content { flex: 1; min-width: 0; padding: 32px 28px 96px; max-width: 52rem; }
  .content h1, .content h2, .content h3, .content h4 {
    line-height: 1.3; margin: 1.6em 0 .6em; scroll-margin-top: 60px;
  }
  .content h1:first-child { margin-top: 0; font-size: 1.9rem; }
  .content h2 { font-size: 1.4rem; padding-bottom: .25em; border-bottom: 1px solid var(--border-soft); }
  .content h3 { font-size: 1.18rem; }
  .content a { color: var(--accent); }
  .content code {
    padding: 1px 6px; font-size: .85em; border-radius: 6px;
    background: var(--code-bg); color: var(--fg);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .content pre {
    padding: 14px 16px; border-radius: 8px; overflow-x: auto;
    background: #0d1117; border: 1px solid #30363d;
  }
  .content pre code { padding: 0; background: none; font-size: .82rem; line-height: 1.5; }
  .content blockquote {
    margin: 1em 0; padding: .1em 1em; color: var(--muted);
    border-left: 4px solid var(--border);
  }
  .content table { border-collapse: collapse; margin: 1em 0; display: block; overflow-x: auto; max-width: 100%; }
  .content th, .content td { padding: 6px 14px; border: 1px solid var(--border-soft); }
  .content th { background: var(--code-bg); }
  .content img { max-width: 100%; }
  .content hr { border: 0; border-top: 1px solid var(--border-soft); margin: 2.5em 0; }
  #load-state { color: var(--muted); }
  #load-state.error { color: #b91c1c; white-space: pre-wrap; }
  @media (max-width: 920px) {
    nav.toc { display: none; }
    main.content { padding: 24px 18px 64px; }
  }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand"><code>k8slab</code> guide</span>
  <span class="spacer"></span>
  <a class="app-link" href="/app.html" title="The topic dashboard">Try the app →</a>
  <button id="theme-toggle" type="button" title="Toggle light/dark theme">◐ theme</button>
</header>
<div class="layout">
  <nav class="toc" id="toc" aria-label="Table of contents">
    <div class="toc-title">Contents</div>
    <ol id="toc-list"></ol>
  </nav>
  <main class="content" id="content">
    <p id="load-state">Loading <code>GUIDE.md</code> …</p>
  </main>
</div>
<!-- Renderer libs are baked into the image at pinned versions (see
     .docker/frontend/Dockerfile) — no CDN at runtime. -->
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/highlight.min.js"></script>
<script>
(function () {
  "use strict";

  /* ---------- theme: stored choice wins, else OS preference ---------- */
  var root = document.documentElement;
  try {
    var saved = localStorage.getItem("guide-theme");
    if (saved === "light" || saved === "dark") root.dataset.theme = saved;
  } catch (e) { /* private mode: stick to the media query */ }
  document.getElementById("theme-toggle").addEventListener("click", function () {
    var dark = (root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("guide-theme", root.dataset.theme); } catch (e) {}
  });

  /* ---------- load + render the guide ---------- */
  var content = document.getElementById("content");

  /* ---------- analytics (see /js/analytics.js) ---------- */
  /* TOC jumps show which sections readers actually open; outbound clicks
     in the rendered guide show what they follow. Both no-op unless the
     image was built with the Umami args. */
  var track = function (name, props) {
    if (typeof window.trackEvent === "function") window.trackEvent(name, props);
  };
  document.getElementById("toc").addEventListener("click", function (e) {
    var a = e.target.closest("a");
    if (a) track("topic-open", { topic: a.textContent });
  });
  content.addEventListener("click", function (e) {
    var a = e.target.closest("a");
    if (!a) return;
    if ((a.protocol === "http:" || a.protocol === "https:") && a.hostname !== location.hostname) {
      track("external-link", { target: a.hostname });
    }
  });

  fetch("/GUIDE.md", { credentials: "same-origin" })
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status + " fetching /GUIDE.md");
      return res.text();
    })
    .then(function (md) {
      /* defense-in-depth: prose may legitimately mention literal <script> etc.;
           blanket-escape them AFTER render so the HTML parser can never enter
           script/style data mode and swallow the rest of the guide */
      var html = marked.parse(md)
        .replace(/<script/gi, "&lt;script")
        .replace(/<\/script>/gi, "&lt;/script&gt;")
        .replace(/<style/gi, "&lt;style")
        .replace(/<template/gi, "&lt;template");
      content.innerHTML = html;  /* replaces the #load-state stub */
      buildToc(content);
      content.querySelectorAll("pre code").forEach(function (el) {
        try { hljs.highlightElement(el); } catch (e) { /* bad lang tag: leave plain */ }
      });
    })
    .catch(function (err) {
      var p = document.getElementById("load-state") || document.createElement("p");
      p.id = "load-state";
      p.className = "error";
      p.textContent = "Could not load the guide: " + err.message +
        "\nThis image may have been built without GUIDE.md (the guide is baked in at docker build time — rebuild the frontend image).";
      content.textContent = "";
      content.appendChild(p);
    });

  /* ---------- sticky auto-generated TOC from rendered headings ---------- */
  function slug(text, used) {
    var s = text.toLowerCase().trim()
      .replace(/[^\w\s-]/g, "")
      .replace(/\s+/g, "-") || "section";
    if (used[s] === undefined) { used[s] = 0; return s; }
    used[s] += 1;
    return s + "-" + used[s];
  }
  function buildToc(rootEl) {
    var list = document.getElementById("toc-list");
    var used = Object.create(null);
    var headings = rootEl.querySelectorAll("h1, h2, h3");
    if (!headings.length) return;
    headings.forEach(function (h) {
      h.id = slug(h.textContent, used);
      var a = document.createElement("a");
      a.href = "#" + h.id;
      a.textContent = h.textContent;
      a.className = "lvl" + h.tagName.slice(1);
      var li = document.createElement("li");
      li.appendChild(a);
      list.appendChild(li);
    });
    /* scrollspy: highlight the TOC entry of the heading in view */
    var links = Array.prototype.slice.call(list.querySelectorAll("a"));
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        links.forEach(function (l) { l.classList.remove("active"); });
        var active = links.filter(function (l) { return l.getAttribute("href") === "#" + entry.target.id; })[0];
        if (active) active.classList.add("active");
      });
    }, { rootMargin: "-15% 0px -70% 0px" });
    headings.forEach(function (h) { observer.observe(h); });
  }
})();
</script>
</body>
</html>
