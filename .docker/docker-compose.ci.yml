# CI override — merged OVER the prod compose file by the CI workflow's e2e
# job (and by local dry-runs of the same flow):
#   docker compose -f .docker/docker-compose-prod.yml \
#     -f .docker/docker-compose.ci.yml up -d --wait
#
# What the override changes, and why:
# - all four images are pinned to the locally built :ci tags, and their
#   container names are pinned to fixed *_ci names (the prod file's
#   ${COLOR:-blue} interpolation then cannot matter). Compose interpolates
#   each file BEFORE merging, so the prod file's ${IMAGE_TAG:?} still
#   fires — the sibling .env in this directory (IMAGE_TAG=ci) is what
#   auto-loads to satisfy it: no registry, no IMAGE_TAG env, `config -q`
#   succeeds bare;
# - the frontend publishes on the loopback only — exactly where prod's
#   commented debug hatch puts it — so the health probe and Playwright
#   reach the real front door at 127.0.0.1:8080;
# - the backends stay unpublished, as in prod;
# - the job creates the external kdg_frontend network idempotently before
#   `up` (external resources are looked up, never created, by compose
#   itself). `down -v --remove-orphans` then removes only what the project
#   owns — the external network is never touched.
#
# The distinct project name isolates CI runs from the real prod stacks'
# containers and networks.
name: kubernetes_developers_guide_ci

services:
    frontend:
        image: ghcr.io/mayank-uk/kubernetes-guide-frontend:ci
        container_name: kubernetes_developers_guide_ci_frontend
        ports:
            - "127.0.0.1:8080:80"

    counter:
        image: ghcr.io/mayank-uk/kubernetes-guide-counter:ci
        container_name: kubernetes_developers_guide_ci_counter

    facts:
        image: ghcr.io/mayank-uk/kubernetes-guide-facts:ci
        container_name: kubernetes_developers_guide_ci_facts

    image:
        image: ghcr.io/mayank-uk/kubernetes-guide-image:ci
        container_name: kubernetes_developers_guide_ci_image
